name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Set up Go
        uses: actions/setup-go@v5.5.0
        with:
          go-version-file: src/go.mod
          cache-dependency-path: src/go.sum

      - name: Verify module dependencies
        working-directory: src
        run: go mod verify

      - name: Check formatting
        working-directory: src
        run: |
          unformatted="$(gofmt -l $(find . -type f -name '*.go'))"
          if [ -n "$unformatted" ]; then
            printf 'Files requiring gofmt:\n%s\n' "$unformatted"
            exit 1
          fi

      - name: Vet
        working-directory: src
        run: go vet ./...

      - name: Test
        working-directory: src
        run: go test -race ./...

      - name: Build
        working-directory: src
        run: go build -o "$RUNNER_TEMP/nebula" .
